name: Symbol E2E

on:
  push:
    paths:
      - "src/kicad/convert.js"
      - "tests/symbols/**"
      - "scripts/test-symbol-e2e.js"
      - "scripts/freeze-symbol-fixture.js"
      - ".github/workflows/symbol-e2e.yml"
  pull_request:
    paths:
      - "src/kicad/convert.js"
      - "tests/symbols/**"
      - "scripts/test-symbol-e2e.js"
      - "scripts/freeze-symbol-fixture.js"
      - ".github/workflows/symbol-e2e.yml"

jobs:
  symbol-e2e:
    name: Symbol conversion e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run symbol e2e suite
        run: node scripts/test-symbol-e2e.js

      - name: Upload symbol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbol-e2e-report
          path: artifacts/
          if-no-files-found: warn
